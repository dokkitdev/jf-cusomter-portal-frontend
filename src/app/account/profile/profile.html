<div
  *ngrxLet="isLoading$; let isLoading"
  class="page profile">
  <div class="page-header">
    <h2 class="page-title">
      {{ 'ACCOUNT.PROFILE.TEXT_PAGE_TITLE' | translate }}
    </h2>
  </div>
  @if (!isLoading) {
    <account-profile-form></account-profile-form>
  } @else {
    <loading-spinner></loading-spinner>
  }
</div>
