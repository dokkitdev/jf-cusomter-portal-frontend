<div class="page page-list jobs">
  <div class="page-header">
    <h2 class="page-title">{{ 'ACCOUNT.JOBS.TEXT_PAGE_TITLE' | translate }}</h2>
    <btn
      [hasIcon]="true"
      [isLoading]="isExporting$ | async"
      (clicked)="exportClicked()"
      size="small">
      <span class="icon icon-download icon-mask icon-small"></span>
      {{ 'ACCOUNT.JOBS.LINK_CSV' | translate }}
    </btn>
  </div>
  <jobs-filters></jobs-filters>
  <jobs-items></jobs-items>
</div>
