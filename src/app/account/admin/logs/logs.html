  <div class="logs">
    <admin-logs-header></admin-logs-header>
    <!-- Tab Content -->
    <div class="tab-content">
      <!-- System Logs Tab -->
      <div
        *ngIf="(activeTab$ | async) === 'system'"

      <!-- Parsing Logs Tab -->
      <div

        class="tab-panel">
        Second
      </div>
    </div>
  </div>
</div>
