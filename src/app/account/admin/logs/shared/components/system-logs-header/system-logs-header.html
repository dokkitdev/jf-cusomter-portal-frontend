<div class="table-head">
  <div
    *ngrxLet="parameters$; let parameters"
    class="table-row">
    <div class="table-cell logs-system-date">
      <header-sort
        [orderBy]="logsSortField.CREATED_AT"
        [parameters]="parameters"
        (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.ADMIN.LOGS.SYSTEM_LOGS_HEADER.TEXT_DATE' | translate }}
      </header-sort>
    </div>
    <div class="table-cell logs-system-type">
      <header-sort
        [orderBy]="logsSortField.REPORT_TYPE"
        [parameters]="parameters"
        (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.ADMIN.LOGS.SYSTEM_LOGS_HEADER.TEXT_TYPE' | translate }}
      </header-sort>
    </div>
    <div class="table-cell logs-system-letters">
      <header-sort
        [orderBy]="logsSortField.LETTERS_GENERATED"
        [parameters]="parameters"
        (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.ADMIN.LOGS.SYSTEM_LOGS_HEADER.TEXT_LETTERS_GENERATED' | translate }}
      </header-sort>
    </div>
    <div class="table-cell logs-system-email">
      {{ 'ACCOUNT.ADMIN.LOGS.SYSTEM_LOGS_HEADER.TEXT_EMAIL_GENERATED' | translate }}
    </div>
  </div>
</div>
