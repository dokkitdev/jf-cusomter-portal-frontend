<table-container
  *ngrxLet="items$; let items"
  [isLoading]="isLoading$ | async"
  [itemsCount]="items.length">
  <div class="table">
    <admin-logs-parsing-logs-header></admin-logs-parsing-logs-header>
    <div class="table-content">
      @for (
        item of items
          | paginate
            : {
                id: paginationId$ | async,
                itemsPerPage: perPage$ | async,
                currentPage: currentPage$ | async,
                totalItems: totalItems$ | async
              };
        track item
      ) {
        <div
          [@heightCollapse]
          class="table-content-row">
          <admin-logs-parsing-logs-item [item]="item"> </admin-logs-parsing-logs-item>
        </div>
      }
    </div>
    @if (hasPagination$ | async) {
      <pagination-elements
        [paginationId]="currentPage$ | async"
        (pageChanged)="pageChanged($event)">
      </pagination-elements>
    }
  </div>
</table-container>
