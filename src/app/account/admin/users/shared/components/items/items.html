<table-container
  *ngrxLet="items$; let items"
  [isLoading]="isLoading$ | async"
  [isLoadingToPage]="isLoadingToPage$ | async"
  [itemsCount]="items?.length"
  [hasMoreItems]="hasMoreItems$ | async">
  <div class="table">
    <admin-users-items-header></admin-users-items-header>
    <div class="table-content">
      <admin-users-item
        *ngFor="let item of items; trackByProperty: 'id'"
        [item]="item"
        [@heightCollapse]
        (deletingSuccess)="itemDeleted($event)">
      </admin-users-item>
    </div>
  </div>
</table-container>
