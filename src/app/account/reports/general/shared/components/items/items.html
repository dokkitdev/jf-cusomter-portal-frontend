<table-container
  *ngrxLet="items$; let items"
  [isLoading]="isLoading$ | async"
  [itemsCount]="items?.length">
  <div class="table">
    <reports-general-table-header></reports-general-table-header>
    <div class="table-content">
      @for (
        item of items
          | paginate
            : {
                id: paginationID$ | async,
                itemsPerPage: perPage$ | async,
                currentPage: currentPage$ | async,
                totalItems: totalItems$ | async
              };
        track item.id
      ) {
        <div
          [@heightCollapse]
          class="table-content-row">
          <reports-general-item
            [item]="item"
            (downloadClicked)="onDownloadClicked($event)">
          </reports-general-item>
        </div>
      }
    </div>
  </div>
</table-container>

@if (hasPagination$ | async) {
  <pagination-elements
    [paginationId]="paginationID$ | async"
    (pageChanged)="onPageChanged($event)">
  </pagination-elements>
}
