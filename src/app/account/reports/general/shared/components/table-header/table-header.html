<div class="table-head">
  <div
    *ngrxLet="parameters$; let parameters"
    class="table-row">
    <div class="table-cell general-date">
      <header-sort
        [orderBy]="generalReportsSortField.CREATED_AT"
        [parameters]="parameters"
        (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.REPORTS.GENERAL.TABLE_HEADER_DATE' | translate }}
      </header-sort>
    </div>
    <div class="table-cell general-type">
      <header-sort
        [orderBy]="generalReportsSortField.REPORT_TYPE"
        [parameters]="parameters"
        (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.REPORTS.GENERAL.TABLE_HEADER_REPORT_TYPE' | translate }}
      </header-sort>
    </div>
    <div class="table-cell general-filename">
      <header-sort
        [orderBy]="generalReportsSortField.FILE_NAME"
        [parameters]="parameters"
        (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.REPORTS.GENERAL.TABLE_HEADER_FILENAME' | translate }}
      </header-sort>
    </div>
    <div class="table-cell general-actions"></div>
  </div>
</div>
