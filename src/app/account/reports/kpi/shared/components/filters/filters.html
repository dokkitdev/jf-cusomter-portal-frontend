<div class="kpi-filters">
  <div class="filters">
    <form
      *ngrxLet="filterFormState$; let filterFormState"
      [ngrxFormState]="filterFormState"
      (ngrxFormActions)="formActionTriggered($event)"
      class="form">
      <filter-select-text
        [controlState]="filterFormState.controls.uprn"
        (controlStateActionTriggered)="formActionTriggered($event)"
        name="{{ 'ACCOUNT.REPORTS.KPI.FILTERS.TEXT_SITE_UPRN' | translate }}">
      </filter-select-text>
      <account-cost-center-multiselect
        [controlState]="filterFormState.controls.costCenterName"
        (controlStateActionTriggered)="formActionTriggered($event)"
        placeholder="{{ 'ACCOUNT.REPORTS.KPI.FILTERS.TEXT_COST_CENTRE' | translate }}">
      </account-cost-center-multiselect>
      <existence-select
        [controlState]="filterFormState.controls.archived"
        [isPermanentlyShowPlaceholder]="true"
        (controlStateActionTriggered)="formActionTriggered($event)"
        placeholder="{{ 'ACCOUNT.REPORTS.KPI.FILTERS.TEXT_ARCHIVED' | translate }}">
      </existence-select>
      <form-datepicker
        [controlState]="filterFormState.controls.dateCreatedFrom"
        [dateFilter]="getStartCreatedDateFilter$ | async"
        (controlStateActionTriggered)="formActionTriggered($event)"
        placeholder="{{ 'ACCOUNT.REPORTS.KPI.FILTERS.TEXT_DATE_CREATED_FROM' | translate }}">
      </form-datepicker>
      <form-datepicker
        [controlState]="filterFormState.controls.dateCreatedTo"
        [dateFilter]="getEndCreatedDateFilter$ | async"
        (controlStateActionTriggered)="formActionTriggered($event)"
        placeholder="{{ 'ACCOUNT.REPORTS.KPI.FILTERS.TEXT_DATE_CREATED_TO' | translate }}">
      </form-datepicker>
      <form-timepicker
        [controlState]="filterFormState.controls.safeTimeFrom"
        (controlStateActionTriggered)="formActionTriggered($event)"
        placeholder="{{ 'ACCOUNT.REPORTS.KPI.FILTERS.TEXT_SAFE_TIME_FROM' | translate }}">
      </form-timepicker>
      <form-timepicker
      [controlState]="filterFormState.controls.safeTimeTo"
      (controlStateActionTriggered)="formActionTriggered($event)"
      placeholder="{{ 'ACCOUNT.REPORTS.KPI.FILTERS.TEXT_SAFE_TIME_TO' | translate }}">
    </form-timepicker>
    </form>
  </div>
  <filter-values
    [items]="filterValues$ | async"
    (filterRemoved)="removeFilterClicked($event)">
  </filter-values>
</div>
