<div class="table-row">
  <div class="table-cell reports-date">{{ item.media?.name }}</div>
  <div class="table-cell reports-type">{{ item.type }}</div>
  <div class="table-cell reports-filename">{{ item.createdAt | date: dateFormat }}</div>
  <div class="table-cell reports-actions">
    <a (click)="downloadMediaClicked()" class="table-action">{{ 'ACCOUNT.REPORTS.LINK_DOWNLOAD' | translate }}</a>
  </div>
</div>
