<div class="table-head">
  <div *ngrxLet="parameters$; let parameters" class="table-row">
    <div class="table-cell reports-date">
      <header-sort [orderBy]="sortField.CREATED_AT" [parameters]="parameters" (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.REPORTS.ITEMS_HEADER.TEXT_DATE' | translate }}
      </header-sort>
    </div>
    <div class="table-cell reports-type">
      <header-sort [orderBy]="sortField.TYPE" [parameters]="parameters" (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.REPORTS.ITEMS_HEADER.TEXT_TYPE' | translate }}
      </header-sort>
    </div>
    <div class="table-cell reports-filename">
      <header-sort [orderBy]="sortField.FILENAME" [parameters]="parameters" (sortChanged)="sortChanged($event)">
        {{ 'ACCOUNT.REPORTS.ITEMS_HEADER.TEXT_FILENAME' | translate }}
      </header-sort>
    </div>
    <div class="table-cell reports-actions">
      {{ 'ACCOUNT.REPORTS.ITEMS_HEADER.TEXT_ACTIONS' | translate }}
    </div>
  </div>
</div>
