@let isReportGenerated = isReportGenerated$ | async;

<div class="page profile">
  <div class="page-header">
    <h2 class="page-title">
      {{ 'ACCOUNT.REPORTS.ZERO.TEXT_PAGE_TITLE' | translate }}
    </h2>
  </div>
  <div class="box zero-box">
    @if (isReportGenerated) {
      <account-success-box
        [text]="'ACCOUNT.REPORTS.ZERO.SUCCESS.TEXT_MESSAGE' | translate"
        [primaryButtonText]="'ACCOUNT.REPORTS.ZERO.SUCCESS.BUTTON_GENERATE_NEW' | translate"
        [secondaryButtonText]="'ACCOUNT.REPORTS.ZERO.SUCCESS.BUTTON_GO_TO_REPORTS' | translate"
        (primaryButtonClicked)="goToReports()"
        (secondaryButtonClicked)="generateNewReport()" />
    } @else {
      <account-reports-zero-form />
    }
  </div>
</div>
