<table-container
  *ngrxLet="items$; let items"
  [isLoading]="isLoading$ | async"
  [itemsCount]="items?.length">
  <div class="table">
    <reports-service-control-items-header></reports-service-control-items-header>
    <div class="table-content">
      <reports-service-control-item
        *ngFor="let item of items | paginate: {
          id: paginationID$ | async,
          itemsPerPage: perPage$ | async,
          currentPage: currentPage$ | async,
          totalItems: totalItems$ | async
        }; trackByProperty: 'id'"
        [item]="item"
        [@heightCollapse]>
      </reports-service-control-item>
    </div>
  </div>
</table-container>
<pagination-elements
  *ngIf="hasPagination$ | async"
  [paginationId]="paginationID$ | async"
  (pageChanged)="pageChanged($event)">
</pagination-elements>
