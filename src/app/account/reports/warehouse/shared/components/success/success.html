<div class="warehouse-success">
  <div class="warehouse-success-content">
    <div class="warehouse-success-icon">
      <div class="success"></div>
    </div>
    <p class="warehouse-success-message">
      {{ 'ACCOUNT.REPORTS.WAREHOUSE.SUCCESS.TEXT_MESSAGE' | translate }}
    </p>
  </div>
  <div class="warehouse-success-actions">
    <btn
      variant="secondary"
      (clicked)="generateNewReport()"
      isBlock="true">
      {{ 'ACCOUNT.REPORTS.WAREHOUSE.SUCCESS.BUTTON_GENERATE_NEW' | translate }}
    </btn>
    <btn
      type="primary"
      isBlock="true"
      (clicked)="goToReports()">
      {{ 'ACCOUNT.REPORTS.WAREHOUSE.SUCCESS.BUTTON_GO_TO_REPORTS' | translate }}
    </btn>
  </div>
</div>
