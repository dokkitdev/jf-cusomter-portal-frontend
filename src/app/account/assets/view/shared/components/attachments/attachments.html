<section
  [isNoContent]="!items?.length"
  name="{{ 'ACCOUNT.ASSETS.VIEW.TEXT_ATTACHMENTS' | translate }}">
  <span
    ngProjectAs="section-icon"
    class="icon icon-clip icon-mask icon-mask-dark-blue"></span>
  @for (item of items; track item) {
    <div class="assetview-attachment">
      <a
        (click)="downloadAttachmentClicked(item)"
        class="link"
        >{{ item.name }}</a
      >
    </div>
  }
</section>
