<table-container [itemsCount]="items.length">
  <div class="table">
    <dialog-view-asset-test-readings-items-header></dialog-view-asset-test-readings-items-header>
    <div class="table-content">
      @for (item of items; track item) {
        <div
          [@heightCollapse]
          class="table-content-row">
          <dialog-view-asset-test-readings-item [item]="item"></dialog-view-asset-test-readings-item>
        </div>
      }
    </div>
  </div>
</table-container>
