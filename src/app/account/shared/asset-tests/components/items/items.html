<table-container
  *ngrxLet="items$; let items"
  [itemsCount]="items.length">
  <div class="table">
    <asset-tests-items-header></asset-tests-items-header>
    <div class="table-content">
      <div
        *ngFor="let item of items; trackByProperty: 'id'"
        [@heightCollapse]
        class="table-content-row">
        <asset-tests-item
          [item]="item"
          (deletingSuccess)="itemDeleted($event)">
        </asset-tests-item>
      </div>
    </div>
  </div>
</table-container>
