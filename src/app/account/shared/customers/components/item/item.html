<div *ngrxLet="customerControlState$; let customerControlState" class="customers-item">
  <account-customer-select
    [controlState]="customerControlState"
    [isLoadByOpen]="true"
    [initialCustomer]="initialGroup?.simproCustomer"
    [excludeID]="excludeCustomerID"
    (controlStateActionTriggered)="customerControlActionTriggered($event)"
    placeholder="{{ 'ACCOUNT.SHARED.CUSTOMERS.TEXT_CUSTOMER' | translate }}">
  </account-customer-select>
  <a (click)="removeClicked()" class="customers-item-action customers-remove">
    <span class="icon icon-mask icon-cross icon-mask-red"></span>
  </a>
</div>
