<div class="form-group">
  <custom-select
    [controlState]="controlState"
    [options]="options"
    [isPermanentlyShowPlaceholder]="isPermanentlyShowPlaceholder"
    (controlStateActionTriggered)="controlStateActionTriggered.emit($event)"
    placeholder="{{ placeholder || 'ACCOUNT.SHARED.JOB_STAGE_SELECT.TEXT_PLACEHOLDER' | translate }}">
  </custom-select>
</div>
