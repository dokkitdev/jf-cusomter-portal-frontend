<div *ngrxLet="dashboardStatistic$; let statistic" class="page dashboard">
  <div class="page-header">
    <h2 class="page-title">{{ 'ACCOUNT.DASHBOARD.TEXT_PAGE_TITLE' | translate }}</h2>
  </div>
  <ng-container *ngIf="isLoading$ | async; else statisticTemplate">
    <loading-spinner [diameter]="spinnerDiameter.HUGE"></loading-spinner>
  </ng-container>
  <ng-template #statisticTemplate>
    <dashboard-statistic-jobs [statistic]="statistic"></dashboard-statistic-jobs>
    <dashboard-statistic-links></dashboard-statistic-links>
  </ng-template>
</div>
