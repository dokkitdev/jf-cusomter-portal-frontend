<public-layout
  *ngrxLet="isRecoveryEmailSent$; let isRecoveryEmailSent"
  title="{{ 'PUBLIC.FORGOT_PASSWORD.TEXT_PAGE_TITLE' | translate }}"
  page="forgot"
  >
  <forgot-password-message></forgot-password-message>
  @if (!isRecoveryEmailSent) {
    <forgot-password-form></forgot-password-form>
  }
  <div class="auth-actions">
    <route-link
      [hasIcon]="true"
      route="/login"
      title="{{ 'PUBLIC.FORGOT_PASSWORD.LINK_SIGN_IN' | translate }}"
      >
      <span
        ngProjectAs="route-icon"
        class="icon icon-arrow-left icon-mask"
      ></span>
    </route-link>
  </div>
</public-layout>
