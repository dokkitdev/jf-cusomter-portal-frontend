<loading-spinner *ngIf="isTokenChecking$ | async; else form"></loading-spinner>
<ng-template #form>
  <ng-container *ngrxLet="isNewUser$; let isNewUser">
    <div *ngIf="isInvalidToken$ | async; else resetForm" class="reset-message">
      {{ 'PUBLIC.RESET_PASSWORD.TEXT_' + ((isNewUser) ? 'ADD' : 'RESET') + '_INCORRECT_TOKEN_MESSAGE' | translate }}
    </div>
    <ng-template #resetForm>
      <form
        *ngrxLet="formState$; let formState"
        [ngrxFormState]="formState"
        (submit)="formSubmitted()"
        (ngrxFormsAction)="formActionTriggered($event)"
        role="form">
        <reset-password-request-error *ngIf="isSubmittingFailed$ | async"></reset-password-request-error>
        <form-text
          [controlState]="formState.controls.password"
          [validationMessages]="{
            required: 'PUBLIC.RESET_PASSWORD.ERRORS.TEXT_PASSWORD_IS_REQUIRED' | translate,
            minLength: 'PUBLIC.RESET_PASSWORD.ERRORS.TEXT_PASSWORD_MIN_LENGTH' | translate: { min: 8 },
            containDigit: 'PUBLIC.RESET_PASSWORD.ERRORS.TEXT_PASSWORD_MUST_CONTAIN_DIGIT' | translate
          }"
          (controlStateActionTriggered)="formActionTriggered($event)"
          placeholder="{{ 'PUBLIC.RESET_PASSWORD.TEXT_PASSWORD_PLACEHOLDER' | translate }}"
          type="password"
          autocomplete="new-password">
        </form-text>
        <form-text
          [controlState]="formState.controls.confirmPassword"
          [validationMessages]="{
            required: 'PUBLIC.RESET_PASSWORD.ERRORS.TEXT_CONFIRM_PASSWORD_IS_REQUIRED' | translate,
            equalTo: 'PUBLIC.RESET_PASSWORD.ERRORS.TEXT_PASSWORDS_MUST_MATCH' | translate
          }"
          (controlStateActionTriggered)="formActionTriggered($event)"
          placeholder="{{ 'PUBLIC.RESET_PASSWORD.TEXT_CONFIRM_PASSWORD_PLACEHOLDER' | translate }}"
          type="password"
          autocomplete="new-password">
        </form-text>
        <button
          [ngClass]="{ 'button-loading': isSubmitting$ | async }"
          (click)="formSubmitted()"
          class="button button-primary button-block">
          {{ 'PUBLIC.RESET_PASSWORD.BUTTON_' + ((isNewUser) ? 'ADD' : 'RESET') | translate }}
        </button>
      </form>
    </ng-template>
  </ng-container>
</ng-template>
