<div class="form-group form-group-timepicker">
  <input
    [ngrxFormControlState]="controlState"
    [placeholder]="placeholder"
    (ngrxFormsAction)="controlStateActionTriggered.emit($event)"
    class="form-control"
    readonly>
  <span class="form-group-timepicker-icon"></span>
  <ngx-mat-timepicker [format]="24" #timepicker></ngx-mat-timepicker>
  <validation-errors
    *ngIf="controlState.isSubmitted && controlState.isInvalid"
    [controlErrors]="controlState.errors"
    [messages]="validationMessages">
  </validation-errors>
</div>
