<div class="form-group form-group-timepicker">
  <input
    [ngrxFormControlState]="controlState"
    [ngxTimepicker]="timepicker"
    [placeholder]="placeholder"
    [format]="24"
    (ngrxFormsAction)="controlStateActionTriggered.emit($event)"
    class="form-control"
    readonly />
  <span class="form-group-timepicker-icon"></span>
  <ngx-material-timepicker
    [theme]="theme"
    #timepicker></ngx-material-timepicker>
  @if (controlState.isSubmitted && controlState.isInvalid) {
    <validation-errors
      [controlErrors]="controlState.errors"
      [messages]="validationMessages">
    </validation-errors>
  }
</div>
