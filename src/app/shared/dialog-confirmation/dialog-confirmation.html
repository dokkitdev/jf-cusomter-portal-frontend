<div class="dialog-confirmation">
  <h1 class="dialog-title">{{ data.title }}</h1>
  @if (data.text) {
    <div class="dialog-message">{{ data.text }}</div>
  }
  <div class="dialog-buttons">
    <button
      (click)="closeButtonClicked()"
      type="button"
      class="dialog-button dialog-button-cancel">
      {{ data.cancelButtonText || ('SHARED.DIALOG_CONFIRMATION.BUTTON_CANCEL' | translate) }}
    </button>
    <button
      (click)="confirmButtonClicked()"
      type="button"
      class="dialog-button dialog-button-confirm">
      {{ data.confirmButtonText || ('SHARED.DIALOG_CONFIRMATION.BUTTON_CONFIRM' | translate) }}
    </button>
  </div>
</div>
