<div class="section">
  @if (name) {
    <div class="section-title">
      <span class="section-title-icon">
        <ng-content select="section-icon"></ng-content>
      </span>
      <span class="section-title-name">{{ name }}</span>
    </div>
  }
  @if (isNoContent) {
    <div class="section-nocontent">
      {{ 'SHARED.SECTION.TEXT_NO_CONTENT' | translate }}
    </div>
  } @else {
    <ng-content></ng-content>
  }
</div>
