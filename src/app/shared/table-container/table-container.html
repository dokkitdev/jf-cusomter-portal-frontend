<div [ngClass]="{ 'table-container-empty': isNotFound || isInitialLoading }" class="table-container">
  <ng-content></ng-content>
</div>
<div *ngIf="isNotFound" class="table-nothing">
  {{ 'SHARED.TABLE_CONTAINER.TEXT_NOTHING' | translate }}
</div>
<loading-spinner *ngIf="isInitialLoading" [diameter]="spinnerDiameter.BIG"></loading-spinner>
