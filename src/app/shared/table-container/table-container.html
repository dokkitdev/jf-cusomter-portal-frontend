<div
  [ngClass]="{ 'table-container-empty': isNotFound || isLoading }"
  class="table-container">
  <ng-content></ng-content>
</div>
@if (isNotFound) {
  <div class="table-nothing">
    {{ 'SHARED.TABLE_CONTAINER.TEXT_NOTHING' | translate }}
  </div>
}
@if (isLoading) {
  <loading-spinner [diameter]="spinnerDiameter.BIG"></loading-spinner>
}
