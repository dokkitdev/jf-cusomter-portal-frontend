<ng-template
  #defaultTemplate
  let-hasTriggerIcon="hasTriggerIcon"
  let-placeholder="placeholder">
  <a
    class="dropdown-trigger dropdown-trigger-placeholder">
    {{ placeholder }}
    <span *ngIf="hasTriggerIcon" class="dropdown-trigger-icon"></span>
  </a>
</ng-template>
<ng-template
  [ngTemplateOutlet]="customTemplate || defaultTemplate"
  [ngTemplateOutletContext]="{
    hasTriggerIcon: hasTriggerIcon,
    placeholder: placeholder
  }">
</ng-template>
